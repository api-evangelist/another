aid: another
name: Another
description: Another is an AI-native software platform that modernizes off-channel and off-price
  inventory operations for fashion, beauty, and retail brands. Founded in 2024 by Corina Marshall,
  the platform connects to a retailer's existing systems - including returns management - to create
  a single source of truth for excess, returned, and pre-loved goods, then automates how brands
  identify, manage, and monetize that inventory across downstream channels. Teams can invite and
  connect with secondary merchandise recipients, send inventory proposals to buyers, request payment
  from partners, and let partners request inventory, replacing fragmented manual workflows spread
  across teams, buyers, channels, and partners. Another closed a $2.5M seed round in January 2026
  co-led by Anthemis and Westbound. As of this profile the company operates a private, invite-based
  web application and publishes no public API, developer portal, or technical documentation.
